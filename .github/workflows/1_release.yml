name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install build
      
      - name: Run tests
        run: python test.py

      - name: Build docs
        run: mkdocs build

      - name: Deploy docs
        run: |
          pip install mike
          git fetch origin gh-pages --depth=1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy "$GITHUB_REF_NAME" latest --push

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1