name: Test Release

on:
  workflow_dispatch:

jobs:
  test-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install build

      - name: Run tests
        run: python test.py

      - name: Build docs
        run: mkdocs build

      - name: Deploy docs
        run: |
          git fetch origin gh-pages --depth=1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy test --update-aliases --push

      - name: Build package
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=$(python -m setuptools_scm | sed 's/+.*//') python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
